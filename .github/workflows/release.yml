name: Release

on:
  push:
    tags:
      - 'V*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Extract version from tag
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^[vV]',''
          Write-Output "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Restore backend
        run: dotnet restore backend/HealthProber.API.csproj

      - name: Publish backend
        run: >
          dotnet publish backend/HealthProber.API.csproj
          -c Release
          -r win-x64
          --self-contained
          -p:Version=${{ steps.get_version.outputs.VERSION }}
          --no-restore

      - name: Install vpk
        run: dotnet tool install -g vpk --version 0.0.1298

      - name: Package with Velopack
        run: >
          vpk pack
          --packId HealthProber
          --packVersion ${{ steps.get_version.outputs.VERSION }}
          --packDir backend/bin/Release/net10.0-windows/win-x64/publish
          --mainExe HealthProber.API.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HealthProber ${{ steps.get_version.outputs.VERSION }}
          files: |
            releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
